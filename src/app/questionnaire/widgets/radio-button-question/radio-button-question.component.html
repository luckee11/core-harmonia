@for (variant of question.payload; track variant.value) {
  <div class="flex items-center gap-2 mb-2">
    <p-radio-button [inputId]="variant.value" name="test" [(ngModel)]="selectedValue" [value]="variant.value"/>
    <label [for]="variant.value" class="text-sm"> {{ variant.label }} </label>
  </div>
}
