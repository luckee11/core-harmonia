<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mb-3">
  <div class="flex flex-column">
    <label for="email" class="text-sm font-medium mb-2">Email или телефон</label>
    <input type="email" pInputText formControlName="login" placeholder="Email" id="email" class="input-field mb-3" />
  </div>

  <div class="flex flex-column">
    <label for="password" class="text-sm font-medium mb-2">Пароль</label>
    <input type="password" pPassword formControlName="password" placeholder="Пароль" id="password" class="input-field mb-3" />
  </div>

  <div class="mb-2">
    <p-button class="btn" styleClass="w-full text-sm main-button-gradient border-none" type="submit">Войти</p-button>
  </div>

  <div class="divider mb-2">
    <span class="text-sm text-slate-600">или войти через</span>
  </div>

  <div class="flex justify-content-between align-items-center">
    <p-button icon="pi pi-envelope" class="w-full mr-2" styleClass="service-connect-button w-full"></p-button>
    <p-button icon="pi pi-twitter" class="w-full mr-2" styleClass="service-connect-button w-full"></p-button>
    <p-button icon="pi pi-facebook" class="w-full" styleClass="service-connect-button w-full"></p-button>
  </div>
</form>
