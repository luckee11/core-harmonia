<div class="container w-screen h-screen flex align-items-center justify-content-center">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="container__login-form p-4 bg-white w-28rem border-round-xl">
      <div class="flex flex-column align-items-center justify-content-center mb-3">
        <h4 class="text-4xl mb-2 main-gradient-color">Core Harmonia</h4>
        <p class="my-1 text-center line-height-3 color-slate-600">Добро пожаловать в ваш персональный медицинский помощник</p>
      </div>

      <div class="mb-3">
        <div class="flex flex-column">
          <label for="email" class="text-sm font-medium mb-2">Email или телефон</label>
          <input type="email" pInputText formControlName="login" placeholder="Email" id="email" class="input-field mb-3" />
        </div>

        <div class="flex flex-column">
          <label for="password" class="text-sm font-medium mb-2">Пароль</label>
          <input type="password" pPassword formControlName="password" placeholder="Пароль" id="password" class="input-field mb-3" />
        </div>

        <div class="mb-2">
          <p-button class="btn " styleClass="w-full text-sm main-button-gradient" type="submit">Войти</p-button>
        </div>

        <div class="divider mb-2">
          <span class="text-sm color-slate-600">или войти через</span>
        </div>

        <div class="flex justify-content-between align-items-center">
          <p-button icon="pi pi-envelope" class="w-full mr-2" styleClass="service-connect-button w-full"></p-button>
          <p-button icon="pi pi-twitter" class="w-full mr-2" styleClass="service-connect-button w-full"></p-button>
          <p-button icon="pi pi-facebook" class="w-full" styleClass="service-connect-button w-full"></p-button>
        </div>
      </div>

      <div class="flex justify-content-center align-content-end">
          <p class="text-sm flex align-items-end">Нет аккаунта?&nbsp;</p>
          <a class="cursor-pointer color-purple-600 underline">Зарегистрироваться</a>
        </div>
    </form>
</div>
